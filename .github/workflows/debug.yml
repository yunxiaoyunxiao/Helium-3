name: Build Helium-3 Debug

on:
  push:
    branches:
      - main
    tags:
      - "test"
  pull_request:
  workflow_dispatch:

concurrency:
  group: helium-3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ''
  XCODE_VERSION: '16.4'
  logT: ''

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg ldid make libplist openssl@3
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Restore additional SDKs
        id: cached-sdks-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: ${{ runner.os }}-sdks-${{ env.XCODE_VERSION }}

      - if: ${{ steps.cached-sdks-restore.outputs.cache-hit != 'true' }}
        name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - if: ${{ steps.cached-sdks-restore.outputs.cache-hit != 'true' }}
        name: Save SDKs
        id: cached-sdks-save
        uses: actions/cache/save@v4
        with:
          path: ${{ env.THEOS }}/sdks
          key: ${{ steps.cached-sdks-restore.outputs.cache-primary-key }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: Helium
          submodules: recursive

      - name: Setup build environment
        run: |
          echo "Available SDKs: $(find $THEOS/sdks -name "*.sdk" -maxdepth 1 -print)"
          sT=$(TZ=UTC-8 date +'%S')
          echo "msT=$(date -j -f "%Y-%m-%d %H:%M:%S" "$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" +%s)" >> $GITHUB_ENV
          echo "logT=$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" >> $GITHUB_ENV
          echo $msT
          echo $logT

      - name: Prepare Swift App Intents metadata extraction
        run: |
          cd "$GITHUB_WORKSPACE/Helium"
          cat > AppIntentsProtocols.txt <<'EOF'
          AppIntents.AppIntent
          AppIntents.AppShortcutsProvider
          EOF
          RULES="$THEOS/makefiles/instance/rules.mk"
          python3 - "$RULES" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          needle = '$(ECHO_NOTHING)$(TARGET_SWIFT_SUPPORT_BIN)/generate-output-file-map $(THEOS_OBJ_DIR) $(_THEOS_OBJ_FILE_TAG) $(SWIFT_FILES) > $@$(ECHO_END)'
          patch = needle + '\n\t$(ECHO_NOTHING)python3 -c \'import json,sys; p=sys.argv[1]; d=json.load(open(p)); [v.update({"const-values":v["object"]+".swiftconstvalues"}) for k,v in d.items() if k and "object" in v]; json.dump(d,open(p,"w"))\' "$@"$(ECHO_END)'
          if needle not in text:
              raise SystemExit("Could not patch Theos Swift output file map")
          path.write_text(text.replace(needle, patch, 1))
          PY

      - name: Make IPA
        run: |
          cd $GITHUB_WORKSPACE/Helium
          bash ./ipabuild.sh --debug

      - name: Extract App Intents metadata
        run: |
          cd "$GITHUB_WORKSPACE/Helium"
          APP="$RUNNER_TEMP/Helium.app"
          mkdir -p "$APP"
          unzip -q build/Helium.tipa "Payload/Helium.app/*" -d "$RUNNER_TEMP/helium-unpacked"
          APP="$RUNNER_TEMP/helium-unpacked/Payload/Helium.app"
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PROCESSOR="$TOOLCHAIN/usr/bin/appintentsmetadataprocessor"
          if [ ! -x "$PROCESSOR" ]; then
            echo "App Intents metadata processor not found: $PROCESSOR"
            exit 1
          fi
          find "$GITHUB_WORKSPACE/Helium/src" -name '*.swift' -print | sort > "$RUNNER_TEMP/Helium.SwiftFileList"
          find "$GITHUB_WORKSPACE/Helium/.theos/obj/debug/arm64" -name '*.swiftconstvalues' -print | sort > "$RUNNER_TEMP/Helium.SwiftConstValuesFileList"
          echo "Swift source files: $(wc -l < "$RUNNER_TEMP/Helium.SwiftFileList")"
          echo "Swift const-value files: $(wc -l < "$RUNNER_TEMP/Helium.SwiftConstValuesFileList")"
          test -s "$RUNNER_TEMP/Helium.SwiftConstValuesFileList"
          "$PROCESSOR" \
            --toolchain-dir "$TOOLCHAIN" \
            --sdk-root "$SDK" \
            --deployment-target 14.0 \
            --target-triple arm64-apple-ios14.0 \
            --platform-family iOS \
            --bundle-identifier com.leemin.helium \
            --xcode-version "$(xcodebuild -version | awk '/Build version/ {print $3}')" \
            --module-name Helium \
            --output "$APP" \
            --binary-file "$APP/Helium" \
            --source-file-list "$RUNNER_TEMP/Helium.SwiftFileList" \
            --swift-const-vals-list "$RUNNER_TEMP/Helium.SwiftConstValuesFileList" \
            --compile-time-extraction
          test -s "$APP/Metadata.appintents/extract.actionsdata"
          cd "$RUNNER_TEMP/helium-unpacked"
          zip -qr "$GITHUB_WORKSPACE/Helium/build/Helium.tipa" Payload

      - name: Collect symbols
        run: |
          cd $GITHUB_WORKSPACE/Helium
          find .theos/obj -name "*.dSYM" -print | zip -r build/Helium_symbols.zip -@

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Helium.tipa
          path: ${{ github.workspace }}/Helium/build/Helium.tipa

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: Helium_symbols
          path: ${{ github.workspace }}/Helium/build/Helium_symbols.zip

      - name: Upload testing release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/test')
        with:
          name: "for testing"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: build time ${{ env.logT }}
          generate_release_notes: true
          prerelease: true
          files: |
            ${{ github.workspace }}/Helium/build/Helium.tipa
